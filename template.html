function programsPage(){return intro('Learning catalog','Find your next learning opportunity.','Browse example programs across business, technology, design, and professional development.')+`<section class="section"><div class="wrap"><div class="notice">These are fictional sample offerings. Replace program descriptions, requirements, schedules, and costs with verified information.</div><div class="cards">${programs.map(programCard).join('')}</div><div class="callout" style="margin-top:32px"><div><h2>Create your own course catalog.</h2><p>Add short courses, certificates, continuing education, or academic programs to this same design.</p></div><a class="btn" href="#/enrollment">Ask About a Program</a></div></div></section>`}

function contactForm(tour=false){const selected=route().split('program=')[1];return `<form onsubmit="submitInquiry(event,${tour})"><div class="form-grid"><label class="field">First name<input name="first" required autocomplete="given-name" maxlength="70"></label><label class="field">Last name<input name="last" required autocomplete="family-name" maxlength="70"></label><label class="field">Email address<input name="email" type="email" required autocomplete="email"></label><label class="field">Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label><label class="field full">Program of interest<select name="program" required><option value="">Choose a program</option>${programs.map(p=>`<option ${selected===p.id?'selected':''}>${p.name}</option>`).join('')}<option>I’m still exploring</option></select></label>${tour?`<label class="field">Preferred tour date<input name="date" type="date" min="${new Date().toLocaleDateString('en-CA')}" required></label><label class="field">Preferred time<select name="time"><option>Morning</option><option>Afternoon</option></select></label>`:''}<label class="field full">What would you like to know?<textarea name="note" maxlength="2000" placeholder="Tell us a little about your goals."></textarea></label></div><p class="form-note">Demo form: use sample details. This creates a downloadable request on your device and does not send it to any institution.</p><label class="check"><input type="checkbox" required>I understand this is a fictional demo request.</label><button class="btn" style="margin-top:20px">${tour?'Create Tour Request':'Create Admissions Request'}</button><div class="form-result" role="status"></div></form>`}
function enrollment(tour=false){return intro(tour?'Visit our campus':'Enrollment',tour?'Explore the learning environment.':'Start your learning journey.',tour?'Use the example visit form to prepare your questions.':'The steps and information below are placeholders for your admissions process.')+`<section class="section"><div class="wrap split" style="align-items:start"><div><h2>${tour?'Connect with our team.':'Find the right program for you.'}</h2><p>${tour?'Customize this section with campus hours, virtual tour options, and your preferred scheduling service.':'Add the eligibility requirements, application timeline, documents, and policies for your own institution.'}</p><div class="panel"><h3>Institution contact information</h3><p><b>Location:</b> ${SITE.location}<br><b>Phone:</b> ${SITE.phone}<br><b>Email:</b> ${SITE.email}</p><p class="placeholder-note">These are editable placeholders. The form does not send any information.</p><a class="btn secondary" href="#/about">Learn About the Institute</a></div><h3 style="margin-top:30px">Example enrollment steps</h3><ul class="clean"><li>Review program details and learning outcomes.</li><li>Check deadlines and any required documents.</li><li>Contact the institution with your questions.</li><li>Follow the verified application and payment instructions.</li></ul></div><div class="panel"><h3>${tour?'Create a sample visit request':'Create a sample admissions inquiry'}</h3>${contactForm(tour)}</div></div></section>`}

function tuition(){return intro('Tuition & fees','Plan your education investment.','This page shows editable sample tuition layouts; no actual prices or financial promises are provided.')+`<section class="section"><div class="wrap"><div class="section-heading"><div><h2>Program pricing placeholders</h2><p>Replace all amounts with your approved published fees and supporting details.</p></div></div><div class="cards">${[['Digital Skills Certificate','[Tuition amount]','[Deposit or payment note]','Specify the total program cost, registration fees, materials, and what is included.'],['Business Fundamentals','[Tuition amount]','[Payment options]','List the tuition, course length, and any approved financial support options.'],['Data & Analytics Essentials','[Tuition amount]','[Application fee]','Include refund policies, required software, and optional costs.']].map(x=>`<article class="panel"><span class="tag">${x[2]}</span><h3 style="margin-top:18px">${x[0]}</h3><div class="serif" style="font-size:32px;color:var(--primary);margin-bottom:16px">${x[1]}</div><p>${x[3]}</p><a class="link" href="#/enrollment">Request fee information</a></article>`).join('')}</div><div class="split" style="margin-top:48px;align-items:start"><div><h2>Choose your payment approach.</h2><p>Add any accepted payment methods, scholarships, installment options, financial aid eligibility, and relevant terms. Do not publish unverified claims.</p><div class="actions"><a class="btn" href="#/enrollment">Contact Admissions</a><a class="btn secondary" href="#/programs">Review Programs</a></div></div><div class="panel"><h3>Common questions</h3>${[['What does tuition cover?','[Add your approved list of included materials, platforms, facilities, and services.]'],['Are scholarships offered?','[Describe actual scholarships and eligibility here, or mark as not available.]'],['Can I learn online?','[Describe your delivery modes, attendance requirements, and online options.]'],['What should I review before paying?','[Link your real enrollment agreement, payment policies, withdrawal policies, and fee schedule.]']].map(x=>`<details class="faq"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div></div><p class="review-note">Everything on this page is sample copy or a labeled placeholder.</p></div></section>`}

function about(){return intro('About us','A place where learning moves forward.','This is sample About Us content for a fictional, multidisciplinary education institute.')+`<section class="section"><div class="wrap split"><img src="${ASSETS.hero}" alt="Replaceable institutional photo placeholder"><div><div class="eyebrow">Our story · [Founder or leadership name]</div><h2>Built around learning, opportunity, and community.</h2><p>Openfield Learning Institute is a fictional example created for this template. Replace this paragraph with your institution's history, founding date, audience, and achievements.</p><h3>Our mission</h3><p>Sample mission: Expand access to meaningful learning through practical education, supportive instruction, and real-world experiences.</p><h3>Our vision</h3><p>Sample vision: Build a welcoming learning community where individuals can explore new interests and develop skills for the future.</p><a class="btn" href="#/tour">Connect With Us</a></div></div></section><section class="section" style="background:var(--light)"><div class="wrap"><div class="section-heading"><div><div class="eyebrow">Our values</div><h2>What matters in our community.</h2></div></div><div class="cards"><div class="panel"><h3>Belonging</h3><p>Create a welcoming environment where learners of different backgrounds and goals can participate.</p></div><div class="panel"><h3>Practical learning</h3><p>Connect lessons to meaningful challenges, activities, and feedback.</p></div><div class="panel"><h3>Curiosity</h3><p>Encourage questions, exploration, creativity, and lifelong learning.</p></div></div></div></section><section class="section"><div class="wrap"><div class="section-heading"><div><div class="eyebrow">Learning outcomes</div><h2>Transferable skills for every path.</h2></div></div><div class="steps">${[['Think critically','Analyze information and approach problems thoughtfully.'],['Communicate clearly','Share ideas effectively through writing, presentation, and conversation.'],['Work together','Collaborate across teams and respond to different perspectives.'],['Keep learning','Set goals, reflect on progress, and adapt to new challenges.']].map((x,i)=>`<div class="step"><div class="num">0${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>`}

function portal(){return intro('Your connected campus','One institution. Multiple views.','Preview demo student, instructor, and leadership workspaces in the same site.')+`<section class="section"><div class="wrap"><div class="notice">Interactive prototype only · All people, data, grades, financial figures, and dates are fabricated examples. No account login or backend is connected.</div><div class="portal-choice">${[['book','Student Portal','Courses, progress, schedule, forms, and messages in one place.','/student','Open Student Demo'],['users','Instructor Workspace','Preview rosters, attendance entry, and class details.','/instructor','Open Instructor Demo'],['chart','Executive Dashboard','Review example enrollment pipelines, reporting, and performance.','/executive','Open Executive Demo']].map(x=>`<div class="panel">${ico(x[0])}<h2 style="font-size:29px">${x[1]}</h2><p>${x[2]}</p><a class="btn" href="#${x[3]}">${x[4]}</a></div>`).join('')}</div></div></section>`}
const studentNav=[['grid','Dashboard','/student'],['calendar','My Schedule','/student/schedule'],['book','E-Learning','/student/learning'],['clock','Learning Hours','/student/hours'],['check','Attendance','/student/attendance'],['cap','Grades','/student/grades'],['chart','Completion Tracker','/student/graduation'],['wallet','Payments','/student/payments'],['file','Documents','/student/documents'],['message','Messages','/student/messages'],['users','Career Services','/student/careers']];
const execNav=[['grid','Executive Dashboard','/executive'],['users','Admissions','/executive/admissions'],['cap','Student Success','/executive/students'],['chart','Reports','/executive/reports']];
function appShell(type,content){const executive=type==='executive',instructor=type==='instructor';const nav=executive?execNav:instructor?[['grid','Overview','/instructor'],['users','Class Roster','/instructor/roster'],['check','Attendance','/instructor/attendance']]:studentNav;return `<div class="app"><aside class="sidebar"><button class="sidebar-close" aria-label="Close sidebar" onclick="document.querySelector('.sidebar').classList.remove('open')">×</button>${brand()}<div class="side-label">${executive?'INSTITUTE MANAGEMENT':instructor?'INSTRUCTOR WORKSPACE':'YOUR LEARNING JOURNEY'}</div><nav aria-label="Workspace navigation">${nav.map(([i,n,p])=>`<a class="side-link ${route()===p?'active':''}" href="#${p}">${ico(i)}${n}</a>`).join('')}</nav><div class="side-bottom"><a class="side-link" href="#/portal">${ico('users')}Switch demo view</a><a class="side-link" href="#/">${ico('home')}Institution website</a><div class="person"><span class="avatar">${executive?'MD':instructor?'JR':'AR'}</span><div>${executive?'Morgan Davis':instructor?'Jamie Rivera':'Alex Reed'}<small>${executive?'Demo administrator':instructor?'Demo instructor':'Demo student'}</small></div></div></div></aside><div class="app-main"><header class="app-top"><div><button class="mobile-side" aria-label="Toggle sidebar" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button><span class="top-link">${SITE.short} / ${executive?'Executive':instructor?'Instructor':'Student'} demo</span></div><div class="right"><span class="tag gold">Fictional demo workspace</span><span class="avatar">${executive?'MD':instructor?'JR':'AR'}</span></div></header><main id="main" class="app-content" tabindex="-1">${content}<p class="review-note">Fictional sample records; changes stay in this browser. <button class="link" style="font-size:12px" onclick="resetDemo()">Reset demo data</button></p></main></div></div>`}
const title=(h,p,extra='')=>`<div class="app-title"><div><h1>${h}</h1><p>${p}</p></div>${extra}</div>`;
const metric=(l,v,s)=>`<div class="metric"><div class="metric-label">${l}</div><strong>${v}</strong><small>${s}</small></div>`;
const progress=(n,v,g=false)=>`<div class="progress-row"><div><span>${n}</span><span>${v}%</span></div><div class="track" role="progressbar" aria-label="${n}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><div class="fill ${g?'gold':''}" style="width:${v}%"></div></div></div>`;
const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const events=()=>`<div class="list-row"><div class="date">OCT<b>23</b></div><div style="flex:1"><b>New learner orientation</b><p>10:00 AM · Main campus / online</p></div></div><div class="list-row"><div class="date">OCT<b>27</b></div><div style="flex:1"><b>Project review workshop</b><p>2:00 PM · Classroom B</p></div></div><div class="list-row"><div class="date">NOV<b>05</b></div><div style="flex:1"><b>Portfolio showcase</b><p>3:00 PM · Community hall</p></div></div>`;
function studentHome(){return title('Welcome back, Alex','Digital Skills Certificate · Demo academic record',`<span class="tag green">On track</span>`)+`<div class="app-banner"><div><div class="eyebrow" style="margin-bottom:10px;color:#ffe1cb">Keep going</div><h2>You're building something new.</h2><p>Continue your collaborative project module and build on what you've learned.</p></div><a class="btn white" href="#/student/learning">Continue Learning</a></div><div class="metrics">${metric('LEARNING HOURS','168 / 240','72 sample hours remaining')}${metric('ATTENDANCE','96%','Demo attendance rate')}${metric('PROGRAM PROGRESS','70%','Based on sample hours')}${metric('CURRENT GPA','3.7','Illustrative grade average')}</div><div class="app-grid"><div class="panel"><h3>Your learning progress</h3>${[['Digital essentials',85],['Team projects',68],['Research skills',72],['Presentations',60]].map(x=>progress(...x)).join('')}<a class="link" href="#/student/grades">Review academic progress</a></div><div class="panel"><h3>Your next steps</h3>${['Review orientation checklist','Upload example registration form','Complete project reflection'].map((x,i)=>`<label class="list-row check" style="justify-content:start"><input type="checkbox" ${store.tasks.includes(i)?'checked':''} onchange="toggleTask(${i},this.checked)"><span>${x}</span></label>`).join('')}<p class="form-note">Demo checklist only. Nothing is submitted.</p></div></div><div class="app-grid"><div class="panel"><h3>Quick access</h3><div class="quick">${[['calendar','My schedule','Class times & events','schedule'],['wallet','Financials','Balance & statements','payments'],['file','Documents','Example forms & records','documents'],['message','Messages','Draft a question','messages'],['chart','My progress','Completion goals','graduation'],['users','Career services','Explore your next step','careers']].map(x=>`<a href="#/student/${x[3]}">${ico(x[0])}<b>${x[1]}</b><p>${x[2]}</p></a>`).join('')}</div></div><div class="panel"><h3>Upcoming events</h3>${events()}</div></div>`}
const modules=['Digital Tools & Productivity','Research and Information Skills','Collaboration in Teams','Creative Problem Solving','Professional Communication'];
const lessonTexts=[['Get comfortable with core tools','Review shared folders, file naming, and productivity tools used in collaborative work.','What is one way to keep a project organized?'],['Find and evaluate information','Compare different sources, check credibility, and organize your research notes.','How can you tell whether a source is reliable?'],['Build a stronger team project','Explore how to set shared goals, split responsibilities, and give constructive feedback.','What makes team communication effective?'],['Explore new approaches','Use brainstorming, rapid prototypes, and feedback to improve an idea.','What would you test first when tackling an unfamiliar problem?'],['Communicate with confidence','Plan clear messages, effective presentations, and thoughtful follow-up.','How would you explain a project to someone new to the subject?']];
function learning(){const n=store.lesson,t=lessonTexts[n];return title('Your online classroom','Digital Skills Certificate · Example self-paced lessons')+`<div class="lesson"><div class="panel" style="padding:0;overflow:hidden"><img class="lesson-photo" src="${ASSETS.classroom}" alt="Replaceable course lesson image"><div class="lesson-body"><div class="eyebrow">Module 0${n+1} · Demo lesson</div><h2 style="font-size:33px">${modules[n]}</h2><h3>${t[0]}</h3><p>${t[1]}</p><div class="notice">Sample lesson content. Replace it with your approved course materials, assessments, and videos.</div><h3>Check your understanding</h3><p>${t[2]}</p><label class="field">Your reflection<textarea id="reflection" placeholder="Write a short reflection before completing this lesson."></textarea></label><div class="actions" style="margin-top:20px"><button class="btn" onclick="completeLesson()">${store.completed.includes(n)?'Lesson Completed':'Mark Lesson Complete'}</button><button class="btn secondary" onclick="download('sample-lesson-notes.txt',modules[store.lesson]+'\n\n'+lessonTexts[store.lesson].join('\n\n'),'text/plain')">Download Notes</button><a class="link" href="#/student/messages">Ask an instructor</a></div></div></div><div><div class="panel"><h3>Course modules</h3>${modules.map((x,i)=>`<button class="lesson-item ${i===n?'active':''}" ${i>0&&!store.completed.includes(i-1)&&!store.completed.includes(i)?'disabled':''} onclick="store.lesson=${i};save();render(false)"><b>0${i+1}</b>${x}<small>${store.completed.includes(i)?'Completed':i===n?'In progress':i>0&&!store.completed.includes(i-1)?'Locked':'Ready to start'}</small></button>`).join('')}${progress('Lessons completed',store.completed.length*20)}</div><div class="panel" style="margin-top:22px"><h3>Learning support</h3><p>Use the demo message tool to draft a question about coursework.</p><a class="link" href="#/student/messages">Open messages</a></div></div></div>`}
function schedule(){return title('My schedule','Illustrative class schedule · October 2026',`<button class="btn secondary small" onclick="downloadSchedule()">Download Calendar</button>`)+`<div class="panel" style="margin-bottom:24px"><h3>This week's classes</h3>${table(['Day','Time','Class','Location'],[['Monday','10:00 AM – 12:00 PM','Digital productivity','Classroom A'],['Tuesday','1:00 PM – 3:00 PM','Team project studio','Learning lab'],['Wednesday','11:00 AM – 12:30 PM','Research skills','Online classroom'],['Thursday','10:00 AM – 1:00 PM','Communication workshop','Classroom B']])}</div><div class="panel"><h3>Institution events</h3>${events()}</div>`}
function hours(){return title('Learning hours','Track your sample progress toward completion')+`<div class="metrics">${metric('COMPLETED','168','Demo learning hours')}${metric('REQUIRED','240','Illustrative target')}${metric('REMAINING','72','Sample hours left')}${metric('THIS WEEK','12','Example scheduled hours')}</div><div class="panel"><h3>Recent activity records</h3>${table(['Date','Activity','Hours','Status'],[['Oct 12, 2026','Digital workflows','2.0','Verified'],['Oct 13, 2026','Team project studio','3.0','Verified'],['Oct 14, 2026','Information literacy','2.0','Verified'],['Oct 15, 2026','Project lab','3.0','Verified'],['Oct 16, 2026','Presentation practice','2.0','Verified']])}</div>`}
function attendance(){return title('My attendance','Sample participation information')+`<div class="metrics">${metric('ATTENDANCE','96%','Example rate')}${metric('PRESENT','24','Of 25 sessions')}${metric('ABSENT','1','Example absence')}${metric('LATE','0','Illustrative arrivals')}</div><div class="panel"><h3>Recent sessions</h3>${table(['Date','Class','Status'],[['Oct 12, 2026','Digital productivity','<span class="tag green">Present</span>'],['Oct 13, 2026','Team project studio','<span class="tag green">Present</span>'],['Oct 14, 2026','Research skills','<span class="tag green">Present</span>'],['Oct 15, 2026','Communication workshop','<span class="tag gold">Absent</span>']])}</div>`}
function grades(){return title('Grades & academics','Digital Skills Certificate · Demo GPA 3.7')+`<div class="panel"><h3>Course overview</h3>${table(['Course','Grade','Progress','Standing'],[['Digital essentials','92%','85%','On track'],['Team projects','88%','68%','On track'],['Research skills','90%','72%','On track'],['Presentations','86%','60%','On track']])}<p class="form-note">Illustrative grades only. This is not a real academic record.</p></div>`}
function graduation(){return title('Completion tracker','See your learning progress and upcoming milestones')+`<div class="app-grid"><div class="panel"><h3>Your program progress</h3><div class="ring" style="background:conic-gradient(var(--primary) 0 70%,#e2eaf8 70%)"><div class="ring-inner"><b>70%</b><span>Hours complete</span></div></div>${progress('Learning hours',70)}${progress('Practical assignments',64,true)}${progress('Portfolio preparation',52)}<p class="form-note">Demo indicators only. Completion is determined by actual institution requirements.</p></div><div class="panel"><h3>Before completion</h3>${['Finish required classes and hours','Submit remaining project assignments','Review your final academic record','Meet with an advisor about next steps'].map(x=>`<div class="list-row">${x}</div>`).join('')}<a class="btn secondary" style="margin-top:22px" href="#/student/messages">Contact Your Advisor</a></div></div>`}
function payments(){return title('Payments & financials','Illustrative account overview')+`<div class="metrics">${metric('CURRENT BALANCE','$680.00','Fictional account')}${metric('NEXT DUE','Nov 10','Example due date')}${metric('ACCOUNT HOLDS','None','Example status')}${metric('PLAN','Installments','Illustrative arrangement')}</div><div class="panel"><div class="section-heading"><h3 style="margin:0">Sample account activity</h3><button class="btn secondary small" onclick="download('sample-statement.csv','Date,Description,Amount\n2026-10-01,Example balance,980\n2026-10-08,Sample payment,-300\n2026-11-10,Remaining balance,680','text/csv')">Download Statement</button></div>${table(['Date','Description','Amount','Status'],[['Oct 1, 2026','Example opening balance','$980.00','Posted'],['Oct 8, 2026','Sample payment','−$300.00','Received'],['Nov 10, 2026','Example remaining balance','$680.00','Due']])}<p class="form-note">Demo only. No payment functionality or real financial record is connected.</p><a class="link" href="#/student/messages">Draft a billing question</a></div>`}
function documents(){return title('My documents','Organize your forms and next steps')+`<div class="notice">Demo upload: only the filename is saved in this browser. File contents are not uploaded, stored, or shared. Use sample files.</div><div class="panel"><h3>Add a document to your checklist</h3><form onsubmit="addDocument(event)"><div class="form-grid"><label class="field">Document type<select name="type"><option>Enrollment form</option><option>Financial aid form</option><option>Prior transcript</option><option>Other</option></select></label><label class="field">Choose sample file<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg" required></label></div><button class="btn" style="margin-top:18px">Add to Demo Checklist</button></form></div><div class="panel" style="margin-top:24px"><h3>Document checklist</h3>${store.docs.length?table(['Filename','Type','Status','Action'],store.docs.map((d,i)=>[esc(d.name),esc(d.type),'Demo entry only',`<button class="link" onclick="store.docs.splice(${i},1);save();render(false)">Remove</button>`])):'<div class="empty">No documents added yet.</div>'}</div>`}
function messages(){return title('Messages','View sample announcements and draft a question')+`<div class="app-grid"><div class="panel"><h3>School announcements</h3><div class="list-row"><div><b>Admissions office</b><p>Welcome to your student workspace. Keep an eye on your schedule and next steps.</p></div><span class="tag">Sample</span></div><div class="list-row"><div><b>Student accounts</b><p>Your example installment is due November 10. Contact the team if you have questions.</p></div></div><h3 style="margin-top:25px">Your saved drafts</h3>${store.messages.length?store.messages.map(m=>`<div class="list-row"><div><b>${esc(m.subject)}</b><p>To ${esc(m.to)} · Draft only</p><p>${esc(m.body)}</p></div></div>`).join(''):'<p>No saved drafts yet.</p>'}</div><div class="panel"><h3>Draft a message</h3><form onsubmit="saveMessage(event)"><label class="field">To<select name="to"><option>Instructor</option><option>Student advisor</option><option>Billing office</option><option>Career services</option></select></label><label class="field" style="margin-top:16px">Subject<input name="subject" required maxlength="100"></label><label class="field" style="margin-top:16px">Message<textarea name="body" required maxlength="2000"></textarea></label><p class="form-note">Saved in this browser. Messages are not sent.</p><button class="btn">Save Draft</button></form></div></div>`}

a></div></div><div class="app-grid equal"><div class="panel"><h3>Inquiries over time</h3><div class="bars" role="img" aria-label="Illustrative monthly inquiries: May 80, June 100, July 115, Aug 127, Sep 145, Oct 136">${(filtered?[21,28,37,40,46,43]:[80,100,115,127,145,136]).map((v,i)=>`<div class="bar" style="--height:${v/(filtered?55:165)*100}%"><b>${v}</b><span>${['May','Jun','Jul','Aug','Sep','Oct'][i]}</span></div>`).join('')}</div></div><div class="panel"><h3>Financial overview</h3><div class="serif" style="font-size:36px;color:var(--primary)">${filtered?'$186,200':'$574,800'}</div><p>Illustrative revenue, year-to-date</p>${[['Fees received',filtered?'$151,200':'$448,800'],['Pending payments',filtered?'$19,600':'$72,600'],['Installments',filtered?'$15,400':'$53,400']].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="metrics">${metric('RETENTION','89%','Fictional example cohort')}${metric('COMPLETION','83%','Fictional example cohort')}${metric('PARTICIPATION','94%','Fictional example cohort')}${metric('SATISFACTION','4.5 / 5','Fictional demo survey')}</div>`}

function instructor(page){if(page==='attendance')return title('Class attendance','Example attendance sheet · Digital Skills')+`<div class="panel"><h3>Record a demo session</h3><form onsubmit="event.preventDefault();store.attendance=Object.fromEntries(new FormData(event.target));save();toast('Demo attendance saved in this browser.')"><label class="field" style="max-width:230px">Session date<input type="date" name="date" required value="${esc(store.attendance?.date||'2026-10-22')}"></label>${table(['Student','Status'],students.filter(s=>s[1]==='Digital Skills').map(s=>[s[0],`<select name="${s[0]}" aria-label="Attendance for ${s[0]}">${['Present','Absent','Late','Excused'].map(x=>`<option ${store.attendance?.[s[0]]===x?'selected':''}>${x}</option>`).join('')}</select>`]))}<button class="btn" style="margin-top:20px">Save Demo Attendance</button></form></div>`;if(page==='roster')return records(false,true);return title('Welcome back, Jamie','Your example teaching workspace')+`<div class="app-banner"><div><div class="eyebrow" style="color:#ffe1cb">Digital Skills class</div><h2>Support your learners.</h2><p>Review demo records and prepare for your next session.</p></div><a class="btn white" href="#/instructor/attendance">Take Attendance</a></div><div class="metrics">${metric('DEMO CLASS','3','Digital Skills learners')}${metric('NEXT CLASS','10:00 AM','Collaboration workshop')}${metric('NEEDS OUTREACH','1','Demo student flag')}${metric('COURSE MODULES','5','Sample curriculum')}</div><div class="panel"><h3>Example class roster</h3>${table(['Student','Program','Standing'],students.filter(s=>s[1]==='Digital Skills').map(s=>[s[0],s[1],s[3]]))}</div>`}

function render(scroll=true){const path=route().split('?')[0];let content;let app=false;if(path.startsWith('/student')){app=true;const part=path.split('/')[2];const pages={schedule,hours,attendance,grades,graduation,payments,documents,messages,careers,learning};content=appShell('student',part?(pages[part]?pages[part]():title('Page not found','Choose a page from the sidebar.')):studentHome())}else if(path.startsWith('/executive')){app=true;const part=path.split('/')[2];content=appShell('executive',part==='admissions'?records(true):part==='students'?records():part==='reports'?reports():executiveHome())}else if(path.startsWith('/instructor')){app=true;content=appShell('instructor',instructor(path.split('/')[2]))}else{let c=path==='/'?home():path==='/programs'?programsPage():path.startsWith('/programs/')?programDetail(path.split('/')[2]):path==='/enrollment'?enrollment():path==='/tour'?enrollment(true):path==='/tuition'?tuition():path==='/about'?about():path==='/portal'?portal():path==='/privacy'?privacy():notFound();content=header()+`<main id="main" tabindex="-1">${c}</main>`+footer()}document.getElementById('root').innerHTML=content;document.title=(document.querySelector('h1')?.textContent||SITE.short)+' | '+SITE.name;if(scroll) animatePageEntrance();if(scroll){window.scrollTo(0,0);document.getElementById('main')?.focus({preventScroll:true})}}
function toast(t){let el=document.getElementById('announcer');el.className='toast';el.textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.className='';el.textContent=''},4500)}
function toggleTask(i,v){store.tasks=v?[...new Set([...store.tasks,i])]:store.tasks.filter(x=>x!==i);save();toast(v?'Checklist item marked complete.':'Checklist item reopened.')}
function completeLesson(){if(store.completed.includes(store.lesson)){toast('This lesson is already complete.');return}if(!document.getElementById('reflection').value.trim()){toast('Add a short reflection first.');document.getElementById('reflection').focus();return}store.completed.push(store.lesson);save();render(false);toast('Lesson completed. Your next module is available.')}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function submitInquiry(e,tour){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const text=`DEMO ${tour?'VISIT':'ADMISSIONS'} REQUEST — NOT SENT\n\n`+Object.entries(d).map(([k,v])=>`${k}: ${v}`).join('\n');download(tour?'sample-visit-request.txt':'sample-admissions-request.txt',text,'text/plain');e.target.querySelector('.form-result').innerHTML='<div class="success">Your example request was prepared for download. It was NOT sent. Connect a verified service before using real inquiries.</div>'}
function addDocument(e){e.preventDefault();const f=e.target.file.files[0];if(f.size>10*1024*1024){toast('Choose a sample file smaller than 10 MB.');return}if(!/\.(pdf|png|jpe?g)$/i.test(f.name)){toast('Choose a PDF, PNG, or JPG file.');return}store.docs.push({name:f.name,type:e.target.type.value});save();render(false);toast('Filename added to your demo checklist.')}
function saveMessage(e){e.preventDefault();store.messages.push(Object.fromEntries(new FormData(e.target)));save();render(false);toast('Draft saved. No message was sent.')}

// Animate each new page and reveal lower sections as they enter the viewport.
// Native reduced-motion preferences keep every page static and immediately usable.
let entranceObserver;
const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
function animatePageEntrance() {
  if (entranceObserver) entranceObserver.disconnect();
  if (motionPreference.matches || !Element.prototype.animate) return;
  const main = document.getElementById('main');
  const selector = '.hero-copy > *, .hero-image, .section-heading, .program, .split > *, .step, .callout, .page-intro .eyebrow, .page-intro h1, .page-intro p, .app-title, .app-banner, .metric, .panel, .notice, .reader > *';
  const candidates = [...main.querySelectorAll(selector)];
  const targets = candidates.filter(el => !candidates.some(parent => parent !== el && parent.contains(el)));
  function enter(elements) {
    elements.forEach((el, i) => {
      const visual = el.matches('img, .hero-image, .program');
      el.animate([
        { opacity: 0, transform: `translateY(${visual ? 24 : 16}px)${visual ? ' scale(.985)' : ''}` },
        { opacity: 1, transform: 'translateY(0) scale(1)' }
      ], { duration: visual ? 700 : 560, delay: Math.min(i * 65, 260), easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' });
    });
  }
  if (!('IntersectionObserver' in window)) { enter(targets); return; }
  entranceObserver = new IntersectionObserver(entries => {
    const incoming = entries.filter(entry => entry.isIntersecting).map(entry => entry.target);
    enter(incoming);
    incoming.forEach(el => entranceObserver.unobserve(el));
  }, { threshold: 0.04 });
  targets.forEach(el => entranceObserver.observe(el));
}
motionPreference.addEventListener('change', () => {
  if (motionPreference.matches) {
    if (entranceObserver) entranceObserver.disconnect();
    document.getAnimations().forEach(animation => animation.cancel());
  }
});

window.addEventListener('hashchange',()=>render());render();
